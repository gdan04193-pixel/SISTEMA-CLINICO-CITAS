<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5e9">
  <title>Modo Offline — HealthVault PWA</title>
  <link rel="icon" href="/static/icons/icon-192x192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: rgba(14, 165, 233, 0.15);
      border: 2px solid #0ea5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge-offline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary {
      background: #0ea5e9;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0284c7;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .connection-status {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container">📡</div>
    <div class="badge-offline">
      <span>●</span> Sin Conexión a Internet
    </div>
    <h1>HealthVault PWA Offline</h1>
    <p>
      No tienes conexión a la red en este momento. La Progressive Web App está activa y tus datos esenciales en caché permanecen seguros y accesibles.
    </p>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        🔄 Reintentar Conexión
      </button>
      <a href="/dashboard" class="btn btn-secondary">
        📋 Ver Expedientes en Caché
      </a>
      <a href="/pwa-features" class="btn btn-secondary">
        🚀 Consola de Pruebas PWA
      </a>
    </div>
    <div class="connection-status" id="conn-status">
      Esperando reconexión a la red...
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      const el = document.getElementById('conn-status');
      el.innerHTML = '🟢 ¡Conexión restablecida! Recargando aplicación...';
      el.style.color = '#10b981';
      setTimeout(() => window.location.reload(), 1500);
    });
  </script>
</body>
</html>
