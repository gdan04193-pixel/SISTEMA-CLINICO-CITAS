{# templates/error.html #}
{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <p class="error-msg">{{ msg }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn-primary">Volver al Dashboard</a>
</div>
{% endblock %}
